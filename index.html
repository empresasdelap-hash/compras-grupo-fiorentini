<script>
  const CONFIG = {
    API_BASE_URL:
      'https://script.google.com/macros/s/AKfycbyB-26Y-FVjiiD7-yVsQ8rKDZu81ZyVxdzcjd4oaj5fQgKi8MswBwdNR-zN7owVxwU84g/exec'
  };

  let PANEL = {
    actualizado: '',
    oc: [],
    proveedores: [],
    empresas: [],
    estados: []
  };

  let OC_VISIBLE = [];
  let OC_MODAL_ACTUAL = null;

  const WHATSAPP_ABIERTO = new Set();
  const CONFIRMACION_ENVIO_EN_CURSO = new Set();
  const CONFIRMACION_RESPUESTA_EN_CURSO = new Set();


  document.addEventListener(
    'DOMContentLoaded',
    cargarDatos
  );


  async function cargarDatos() {
    mostrarCarga(true);
    ocultarError();

    const boton =
      document.getElementById(
        'btnActualizar'
      );

    boton.disabled = true;

    try {
      const url =
        CONFIG.API_BASE_URL
        +
        '?api=compras&accion=listar';

      const respuesta =
        await cargarJsonp(url);

      if (
        !respuesta ||
        respuesta.ok !== true
      ) {
        throw new Error(
          respuesta &&
          respuesta.error
            ? respuesta.error
            : 'No fue posible cargar Compras.'
        );
      }

      PANEL =
        respuesta.data || {
          actualizado: '',
          oc: [],
          proveedores: [],
          empresas: [],
          estados: []
        };

      cargarSelects();
      aplicarFiltros();

      document
        .getElementById(
          'ultimaActualizacion'
        )
        .textContent =
          'Actualizado: '
          +
          (
            PANEL.actualizado ||
            '-'
          );

    } catch (error) {
      mostrarError(
        error &&
        error.message
          ? error.message
          : String(error)
      );

    } finally {
      mostrarCarga(false);
      boton.disabled = false;
    }
  }


  function cargarJsonp(url) {
    return new Promise(
      function(resolve, reject) {
        const callback =
          '__gfCompras_'
          +
          Date.now()
          +
          '_'
          +
          Math.floor(
            Math.random() * 100000
          );

        const script =
          document.createElement(
            'script'
          );

        const separador =
          url.includes('?')
            ? '&'
            : '?';

        const timeout =
          window.setTimeout(
            function() {
              limpiar();

              reject(
                new Error(
                  'Tiempo de espera agotado consultando MAESTRO.'
                )
              );
            },
            20000
          );

        function limpiar() {
          window.clearTimeout(
            timeout
          );

          if (
            script.parentNode
          ) {
            script
              .parentNode
              .removeChild(
                script
              );
          }

          try {
            delete window[
              callback
            ];

          } catch (error) {
            window[
              callback
            ] = undefined;
          }
        }

        window[
          callback
        ] =
          function(respuesta) {
            limpiar();
            resolve(respuesta);
          };

        script.onerror =
          function() {
            limpiar();

            reject(
              new Error(
                'No fue posible conectar con la API.'
              )
            );
          };

        script.src =
          url
          +
          separador
          +
          'callback='
          +
          encodeURIComponent(
            callback
          );

        document
          .head
          .appendChild(
            script
          );
      }
    );
  }


  function cargarSelects() {
    llenarSelect(
      'filtroEstado',
      PANEL.estados || [],
      'Todos'
    );

    llenarSelect(
      'filtroProveedor',
      PANEL.proveedores || [],
      'Todos'
    );

    llenarSelect(
      'filtroEmpresa',
      PANEL.empresas || [],
      'Todas'
    );
  }


  function llenarSelect(
    id,
    valores,
    textoTodos
  ) {
    const select =
      document.getElementById(id);

    const actual =
      select.value;

    select.innerHTML = '';

    const primero =
      document.createElement(
        'option'
      );

    primero.value = '';
    primero.textContent =
      textoTodos;

    select.appendChild(
      primero
    );

    valores.forEach(
      function(valor) {
        const option =
          document.createElement(
            'option'
          );

        option.value =
          valor;

        option.textContent =
          valor;

        select.appendChild(
          option
        );
      }
    );

    if (
      Array
        .from(
          select.options
        )
        .some(
          function(option) {
            return (
              option.value ===
              actual
            );
          }
        )
    ) {
      select.value =
        actual;
    }
  }


  function aplicarFiltros() {
    const estado =
      document
        .getElementById(
          'filtroEstado'
        )
        .value;

    const proveedor =
      document
        .getElementById(
          'filtroProveedor'
        )
        .value;

    const empresa =
      document
        .getElementById(
          'filtroEmpresa'
        )
        .value;

    OC_VISIBLE =
      (
        PANEL.oc ||
        []
      )
      .filter(
        function(item) {
          return (
            (
              !estado ||
              item.estado === estado
            )
            &&
            (
              !proveedor ||
              item.proveedor === proveedor
            )
            &&
            (
              !empresa ||
              item.empresa === empresa
            )
          );
        }
      );

    renderTarjetas(
      OC_VISIBLE
    );
  }


  function renderTarjetas(lista) {
    const contenedor =
      document.getElementById(
        'cardsContainer'
      );

    const empty =
      document.getElementById(
        'emptyBox'
      );

    contenedor.innerHTML = '';

    document
      .getElementById(
        'contadorResultados'
      )
      .textContent =
        lista.length +
        ' OC';

    if (
      !lista.length
    ) {
      empty.style.display =
        'block';

      return;
    }

    empty.style.display =
      'none';

    lista.forEach(
      function(item) {
        const card =
          document.createElement(
            'article'
          );

        card.className =
          'oc-card';

        card.innerHTML = `
          <div class="card-head">

            <div class="card-check">
              <input type="checkbox">
            </div>

            <div class="card-main">

              <div class="card-title-row">

                <div class="oc-number">
                  ${escapeHtml(item.oc)}
                </div>

                <span
                  class="
                    status
                    status-${escapeHtml(item.color || 'GRIS')}
                  "
                >
                  ${escapeHtml(item.estado)}
                </span>

              </div>

              <div class="provider">
                ${escapeHtml(
                  item.proveedor ||
                  'SIN PROVEEDOR'
                )}
              </div>

              <div class="meta">

                <div>
                  <strong>
                    Empresa:
                  </strong>

                  ${escapeHtml(item.empresa)}
                </div>

                <div>
                  <strong>
                    Lote:
                  </strong>

                  ${escapeHtml(
                    item.lote ||
                    '-'
                  )}
                </div>

              </div>

              <div class="amount-row">

                <div class="line-count">
                  ${item.cantidadLineas || 0}
                  ${
                    Number(
                      item.cantidadLineas
                    ) === 1
                      ? 'producto'
                      : 'productos'
                  }
                </div>

                <div class="amount">
                  ${formatoMoneda(item.bruto)}
                </div>

              </div>

            </div>

          </div>

          <div class="actions">

            <button
              class="btn btn-view"
              onclick="
                verOC(
                  '${jsString(item.clave)}'
                )
              "
            >
              Ver OC
            </button>

            ${botonAccionHTML(item)}

          </div>
        `;

        contenedor.appendChild(
          card
        );
      }
    );
  }


  function botonAccionHTML(item) {
    const estado =
      normalizar(
        item.estado
      );

    if (
      estado ===
      'PENDIENTE DE ENVIO'
    ) {
      const yaAbrioWhatsApp =
        WHATSAPP_ABIERTO.has(
          item.clave
        );

      if (
        yaAbrioWhatsApp
      ) {
        return `
          <button
            class="btn btn-confirmar-envio"
            data-confirmar-envio="${escapeHtml(item.clave)}"
            onclick="
              confirmarEnvio(
                '${jsString(item.clave)}'
              )
            "
          >
            Confirmar envío
          </button>
        `;
      }

      return `
        <button
          class="btn btn-whatsapp"
          onclick="
            abrirWhatsApp(
              '${jsString(item.clave)}'
            )
          "
        >
          WhatsApp
        </button>
      `;
    }


    if (
      estado ===
      'ESPERANDO RESPUESTA'
    ) {
      return `
        <button
          class="btn btn-blue"
          onclick="
            confirmarRespuestaProveedor(
              '${jsString(item.clave)}'
            )
          "
        >
          Registrar respuesta
        </button>
      `;
    }


    if (
      estado ===
      'EXCEPCION'
    ) {
      return `
        <button
          class="btn btn-blue"
          onclick="
            avisoMVP(
              'Gestión de excepción todavía no habilitada.'
            )
          "
        >
          Gestionar
        </button>
      `;
    }


    return `
      <button
        class="btn btn-blue"
        onclick="
          avisoMVP(
            'La OC continúa en seguimiento.'
          )
        "
      >
        Seguimiento
      </button>
    `;
  }


  function verOC(clave) {
    const item =
      (
        PANEL.oc ||
        []
      )
      .find(
        function(oc) {
          return (
            oc.clave ===
            clave
          );
        }
      );

    if (
      !item
    ) {
      avisoMVP(
        'No se pudo localizar la OC.'
      );

      return;
    }

    OC_MODAL_ACTUAL =
      item;

    document
      .getElementById(
        'documentoOC'
      )
      .innerHTML =
        construirDocumentoOC(
          item
        );

    actualizarBotonesModalEnvio(
      item
    );

    document
      .getElementById(
        'modalOC'
      )
      .classList
      .add(
        'visible'
      );

    document.body.style.overflow =
      'hidden';
  }


  function construirDocumentoOC(item) {
    const lineas =
      item.lineas || [];

    const filas =
      lineas
        .map(
          function(
            linea,
            index
          ) {
            return `
              <tr>

                <td class="center">
                  ${index + 1}
                </td>

                <td class="center">
                  ${escapeHtml(
                    linea.codigo || ''
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    linea.producto
                  )}
                </td>

                <td class="center">
                  ${formatoNumero(
                    linea.cantidad
                  )}
                </td>

                <td class="center">
                  ${escapeHtml(
                    linea.unidad
                  )}
                </td>

                <td class="money">
                  ${formatoMoneda(
                    linea.precio
                  )}
                </td>

                <td class="money">
                  ${formatoMoneda(
                    linea.total
                  )}
                </td>

              </tr>
            `;
          }
        )
        .join('');

    const cantidadFilasVacias =
      Math.max(
        0,
        9 - lineas.length
      );

    let filasVacias = '';

    for (
      let i = 0;
      i < cantidadFilasVacias;
      i++
    ) {
      filasVacias += `
        <tr class="po-empty-row">
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      `;
    }

    return `
      <div class="purchase-order">

        <div class="po-header-top">

          <div class="po-brand">

            <img
              src="Logo-Cafe-de-la-P.jpeg"
              alt="Café de la P"
              class="po-logo-real"
            >

            <div class="po-company-name">
              ${escapeHtml(
                item.empresaDocumento ||
                item.empresa
              )}
            </div>

            ${lineaEmpresa(
              'RUT',
              item.rutEmpresa
            )}

            ${lineaEmpresa(
              'Dirección',
              item.direccionEmpresa
            )}

            ${lineaEmpresa(
              'Correo',
              item.correoEmpresa
            )}

          </div>


          <div class="po-right-header">

            <div class="po-title">
              ORDEN DE COMPRA
            </div>

            <div class="po-number-bar">
              N° ${escapeHtml(item.oc)}
            </div>

            ${
              item.lote
                ? campoMeta(
                    'LOTE:',
                    item.lote
                  )
                : ''
            }

            ${campoMeta(
              'FECHA DE EMISIÓN:',
              item.fechaEmision || '-'
            )}

            ${campoMeta(
              'FECHA DE ENTREGA:',
              item.fechaEntrega || ''
            )}

            <div class="po-meta-row">

              <div class="po-meta-label">
                ESTADO:
              </div>

              <div class="po-state">
                APROBADO POR JEFATURA
              </div>

            </div>

          </div>

        </div>


        <div class="po-supplier-row">

          <div>

            <div class="po-section-title">
              DATOS DEL PROVEEDOR
            </div>

            <div class="po-provider-name">
              ${escapeHtml(
                item.proveedor ||
                '-'
              )}
            </div>

            ${lineaProveedor(
              'RUT',
              item.rutProveedor
            )}

            ${lineaProveedor(
              'Contacto',
              item.contactoProveedor
            )}

            ${lineaProveedor(
              'Correo',
              item.correoProveedor
            )}

            ${lineaProveedor(
              'Teléfono',
              item.telefonoProveedor
            )}

          </div>


          <div class="po-oc-reminder">

            <div class="po-reminder-text">
              Por favor, en todas sus facturas,
              guías de despacho y demás documentos
              tributarios, indique el número de esta
              Orden de Compra:
            </div>

            <div class="po-reminder-number">
              ${escapeHtml(item.oc)}
            </div>

          </div>

        </div>


        <div class="po-table-wrap">

          <table class="po-table">

            <thead>

              <tr>

                <th class="col-num">
                  N°
                </th>

                <th class="col-codigo">
                  CÓDIGO
                </th>

                <th class="col-producto">
                  PRODUCTO
                </th>

                <th class="col-cantidad">
                  CANTIDAD
                </th>

                <th class="col-unidad">
                  UND. DE MEDIDA
                </th>

                <th class="col-precio">
                  PRECIO UNITARIO
                </th>

                <th class="col-total">
                  TOTAL
                </th>

              </tr>

            </thead>

            <tbody>
              ${filas}
              ${filasVacias}
            </tbody>

          </table>

        </div>


        <div class="po-totals-area">

          <table class="po-totals">

            <tr>

              <td>
                SUBTOTAL NETO
              </td>

              <td>
                ${formatoMoneda(item.neto)}
              </td>

            </tr>

            <tr>

              <td>
                IVA (19%)
              </td>

              <td>
                ${formatoMoneda(item.iva)}
              </td>

            </tr>

            <tr class="po-total-final">

              <td>
                TOTAL FINAL
              </td>

              <td>
                ${formatoMoneda(item.bruto)}
              </td>

            </tr>

          </table>

        </div>


        <div class="po-conditions">

          <div class="po-conditions-title">
            CONDICIONES DE COMPRA
          </div>

          <ol>

            <li>
              Entrega de los productos en la dirección
              indicada por la empresa emisora, en la fecha
              y horario acordados.
            </li>

            <li>
              Los productos deben ser de la calidad,
              marca y presentación solicitada.
            </li>

            <li>
              Cualquier cambio o sustitución debe ser
              previamente autorizado por el área de compras.
            </li>

            <li>
              Factura electrónica, guía de despacho y demás
              documentos tributarios deben hacer referencia
              al número de esta Orden de Compra (OC).
            </li>

            <li>
              En caso de diferencias entre lo facturado y lo
              recibido, éstas serán comunicadas al proveedor
              para su regularización.
            </li>

            <li>
              El incumplimiento de las condiciones acordadas
              podrá derivar en la no recepción de la mercadería
              y/o anulación de la Orden de Compra.
            </li>

            <li>
              Los precios indicados en esta OC son fijos y no
              podrán ser modificados sin autorización previa.
            </li>

            <li>
              Cualquier duda respecto a esta OC debe ser
              canalizada a través del área de compras.
            </li>

            <li>
              Plazos de entrega y condiciones logísticas según
              lo acordado con el proveedor.
            </li>

            <li>
              El proveedor debe cumplir con toda la normativa
              legal y sanitaria vigente aplicable a los
              productos suministrados.
            </li>

            <li>
              En caso de incumplimiento, la empresa emisora
              podrá rechazar la mercadería y/o aplicar las
              medidas correspondientes.
            </li>

            <li>
              Esta Orden de Compra constituye un compromiso
              formal de compra una vez aprobada.
            </li>

          </ol>

        </div>


        <div class="po-footer-bar">

          <div class="po-footer-message">
            Gracias por ser parte de nuestro camino
          </div>

          <div class="po-footer-company">
            GRUPO FIORENTINI
          </div>

        </div>

      </div>
    `;
  }


  function campoMeta(
    etiqueta,
    valor
  ) {
    return `
      <div class="po-meta-row">

        <div class="po-meta-label">
          ${escapeHtml(etiqueta)}
        </div>

        <div class="po-meta-value">
          ${escapeHtml(valor || '')}
        </div>

      </div>
    `;
  }


  function lineaEmpresa(
    etiqueta,
    valor
  ) {
    if (
      !valor
    ) {
      return '';
    }

    return `
      <div class="po-company-line">

        <strong>
          ${escapeHtml(etiqueta)}:
        </strong>

        ${escapeHtml(valor)}

      </div>
    `;
  }


  function lineaProveedor(
    etiqueta,
    valor
  ) {
    if (
      !valor
    ) {
      return '';
    }

    return `
      <div class="po-provider-line">

        <strong>
          ${escapeHtml(etiqueta)}:
        </strong>

        ${escapeHtml(valor)}

      </div>
    `;
  }


  function cerrarOC() {
    document
      .getElementById(
        'modalOC'
      )
      .classList
      .remove(
        'visible'
      );

    document.body.style.overflow =
      '';

    OC_MODAL_ACTUAL =
      null;
  }


  function cerrarModalPorFondo(
    event
  ) {
    if (
      event.target.id ===
      'modalOC'
    ) {
      cerrarOC();
    }
  }


  function abrirWhatsApp(clave) {
    const item =
      (
        PANEL.oc ||
        []
      )
      .find(
        function(oc) {
          return (
            oc.clave ===
            clave
          );
        }
      );

    if (
      !item
    ) {
      avisoMVP(
        'No se pudo localizar la OC.'
      );

      return;
    }

    const mensaje =
      construirMensajeWhatsApp(
        item
      );

    const urlWhatsApp =
      'https://wa.me/?text='
      +
      encodeURIComponent(
        mensaje
      );

    const ventana =
      window.open(
        urlWhatsApp,
        '_blank',
        'noopener,noreferrer'
      );

    WHATSAPP_ABIERTO.add(
      clave
    );

    aplicarFiltros();

    if (
      OC_MODAL_ACTUAL &&
      OC_MODAL_ACTUAL.clave ===
        clave
    ) {
      actualizarBotonesModalEnvio(
        OC_MODAL_ACTUAL
      );
    }

    if (
      !ventana
    ) {
      avisoMVP(
        'El navegador pudo bloquear la apertura de WhatsApp. Habilita las ventanas emergentes e inténtalo nuevamente.'
      );

      return;
    }

    avisoMVP(
      item.oc
      +
      ' abierta en WhatsApp. Después de enviarla realmente, vuelve y presiona CONFIRMAR ENVÍO.'
    );
  }


  function construirMensajeWhatsApp(
    item
  ) {
    const partes = [];

    partes.push(
      'Hola.'
    );

    partes.push(
      ''
    );

    partes.push(
      'Compartimos la Orden de Compra '
      +
      item.oc
      +
      ' de Grupo Fiorentini.'
    );

    if (
      item.proveedor
    ) {
      partes.push(
        'Proveedor: '
        +
        item.proveedor
        +
        '.'
      );
    }

    if (
      item.lote
    ) {
      partes.push(
        'Lote: '
        +
        item.lote
        +
        '.'
      );
    }

    partes.push(
      'Total: '
      +
      formatoMoneda(
        item.bruto
      )
      +
      '.'
    );

    partes.push(
      ''
    );

    partes.push(
      'Por favor confirmar recepción y disponibilidad del pedido.'
    );

    partes.push(
      ''
    );

    partes.push(
      'Gracias.'
    );

    partes.push(
      'Grupo Fiorentini'
    );

    return partes.join(
      '\n'
    );
  }


  async function confirmarEnvio(
    clave
  ) {
    const item =
      (
        PANEL.oc ||
        []
      )
      .find(
        function(oc) {
          return (
            oc.clave ===
            clave
          );
        }
      );

    if (
      !item
    ) {
      avisoMVP(
        'No se pudo localizar la OC.'
      );

      return;
    }

    if (
      !WHATSAPP_ABIERTO.has(
        clave
      )
    ) {
      avisoMVP(
        'Primero abre WhatsApp para esta OC.'
      );

      return;
    }

    if (
      CONFIRMACION_ENVIO_EN_CURSO.has(
        clave
      )
    ) {
      return;
    }

    const confirmado =
      window.confirm(
        '¿Confirmas que la '
        +
        item.oc
        +
        ' fue enviada realmente al proveedor '
        +
        (
          item.proveedor ||
          ''
        )
        +
        ' por WhatsApp?\n\n'
        +
        'Al confirmar, MAESTRO registrará el envío.'
      );

    if (
      !confirmado
    ) {
      return;
    }

    CONFIRMACION_ENVIO_EN_CURSO.add(
      clave
    );

    actualizarEstadoBotonesConfirmacion(
      clave,
      true
    );

    try {
      const url =
        CONFIG.API_BASE_URL
        +
        '?api=compras'
        +
        '&accion=confirmarEnvio'
        +
        '&empresa='
        +
        encodeURIComponent(
          item.empresa
        )
        +
        '&oc='
        +
        encodeURIComponent(
          item.oc
        )
        +
        '&confirmar=SI';

      const respuesta =
        await cargarJsonp(
          url
        );

      if (
        !respuesta ||
        respuesta.ok !== true
      ) {
        throw new Error(
          respuesta &&
          respuesta.error
            ? respuesta.error
            : 'No fue posible confirmar el envío en MAESTRO.'
        );
      }

      const data =
        respuesta.data || {};

      WHATSAPP_ABIERTO.delete(
        clave
      );

      avisoMVP(
        data.yaConfirmada
          ? item.oc
            +
            ' ya estaba registrada como ENVIADA.'
          : item.oc
            +
            ' confirmada como ENVIADA. Ahora queda ESPERANDO RESPUESTA.'
      );

      if (
        OC_MODAL_ACTUAL &&
        OC_MODAL_ACTUAL.clave ===
          clave
      ) {
        cerrarOC();
      }

      await cargarDatos();

    } catch (error) {
      avisoMVP(
        error &&
        error.message
          ? error.message
          : String(error)
      );

    } finally {
      CONFIRMACION_ENVIO_EN_CURSO.delete(
        clave
      );

      actualizarEstadoBotonesConfirmacion(
        clave,
        false
      );
    }
  }


  async function confirmarRespuestaProveedor(
    clave
  ) {
    const item =
      (
        PANEL.oc ||
        []
      )
      .find(
        function(oc) {
          return (
            oc.clave ===
            clave
          );
        }
      );

    if (
      !item
    ) {
      avisoMVP(
        'No se pudo localizar la OC.'
      );

      return;
    }

    if (
      normalizar(
        item.estado
      ) !==
      'ESPERANDO RESPUESTA'
    ) {
      avisoMVP(
        'Esta OC ya no está esperando respuesta del proveedor.'
      );

      await cargarDatos();

      return;
    }

    if (
      CONFIRMACION_RESPUESTA_EN_CURSO.has(
        clave
      )
    ) {
      return;
    }

    const confirmado =
      window.confirm(
        '¿Confirmas que el proveedor '
        +
        (
          item.proveedor ||
          ''
        )
        +
        ' CONFIRMÓ la recepción y disponibilidad de la '
        +
        item.oc
        +
        '?\n\n'
        +
        'Al confirmar, MAESTRO registrará la respuesta CONFIRMO.'
      );

    if (
      !confirmado
    ) {
      return;
    }

    CONFIRMACION_RESPUESTA_EN_CURSO.add(
      clave
    );

    try {
      const url =
        CONFIG.API_BASE_URL
        +
        '?api=compras'
        +
        '&accion=confirmarRespuesta'
        +
        '&empresa='
        +
        encodeURIComponent(
          item.empresa
        )
        +
        '&oc='
        +
        encodeURIComponent(
          item.oc
        )
        +
        '&respuesta=CONFIRMO'
        +
        '&confirmar=SI';

      const respuesta =
        await cargarJsonp(
          url
        );

      if (
        !respuesta ||
        respuesta.ok !== true
      ) {
        throw new Error(
          respuesta &&
          respuesta.error
            ? respuesta.error
            : 'No fue posible registrar la respuesta en MAESTRO.'
        );
      }

      const data =
        respuesta.data || {};

      avisoMVP(
        data.yaConfirmada
          ? item.oc
            +
            ' ya tenía registrada la respuesta CONFIRMO.'
          : item.oc
            +
            ' registrada como CONFIRMO. Ahora queda HABILITADA PARA RECEPCIÓN.'
      );

      if (
        OC_MODAL_ACTUAL &&
        OC_MODAL_ACTUAL.clave ===
          clave
      ) {
        cerrarOC();
      }

      await cargarDatos();

    } catch (error) {
      avisoMVP(
        error &&
        error.message
          ? error.message
          : String(error)
      );

    } finally {
      CONFIRMACION_RESPUESTA_EN_CURSO.delete(
        clave
      );
    }
  }


  function actualizarEstadoBotonesConfirmacion(
    clave,
    cargando
  ) {
    const botones =
      document.querySelectorAll(
        '[data-confirmar-envio="'
        +
        cssEscapeSeguro(
          clave
        )
        +
        '"]'
      );

    botones.forEach(
      function(boton) {
        boton.disabled =
          cargando;

        boton.textContent =
          cargando
            ? 'Confirmando...'
            : 'Confirmar envío';
      }
    );

    const botonModal =
      document.getElementById(
        'btnConfirmarEnvioModal'
      );

    if (
      botonModal &&
      OC_MODAL_ACTUAL &&
      OC_MODAL_ACTUAL.clave ===
        clave
    ) {
      botonModal.disabled =
        cargando;

      botonModal.textContent =
        cargando
          ? 'Confirmando...'
          : 'Confirmar envío';
    }
  }


  function abrirWhatsAppDesdeModal() {
    if (
      !OC_MODAL_ACTUAL
    ) {
      return;
    }

    abrirWhatsApp(
      OC_MODAL_ACTUAL.clave
    );
  }


  function confirmarEnvioDesdeModal() {
    if (
      !OC_MODAL_ACTUAL
    ) {
      return;
    }

    confirmarEnvio(
      OC_MODAL_ACTUAL.clave
    );
  }


  function actualizarBotonesModalEnvio(
    item
  ) {
    const botonWhatsApp =
      document.getElementById(
        'btnEnviarModal'
      );

    const botonConfirmar =
      document.getElementById(
        'btnConfirmarEnvioModal'
      );

    if (
      !botonWhatsApp ||
      !botonConfirmar
    ) {
      return;
    }

    const pendiente =
      normalizar(
        item.estado
      ) ===
      'PENDIENTE DE ENVIO';

    if (
      !pendiente
    ) {
      botonWhatsApp.style.display =
        'none';

      botonConfirmar.style.display =
        'none';

      return;
    }

    const yaAbrioWhatsApp =
      WHATSAPP_ABIERTO.has(
        item.clave
      );

    botonWhatsApp.style.display =
      yaAbrioWhatsApp
        ? 'none'
        : 'block';

    botonConfirmar.style.display =
      yaAbrioWhatsApp
        ? 'block'
        : 'none';
  }


  function cssEscapeSeguro(
    valor
  ) {
    if (
      window.CSS &&
      typeof window.CSS.escape ===
        'function'
    ) {
      return window.CSS.escape(
        String(
          valor || ''
        )
      );
    }

    return String(
      valor || ''
    )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /"/g,
      '\\"'
    );
  }


  function mostrarCarga(
    mostrar
  ) {
    document
      .getElementById(
        'loading'
      )
      .style
      .display =
        mostrar
          ? 'block'
          : 'none';
  }


  function mostrarError(
    mensaje
  ) {
    const box =
      document.getElementById(
        'errorBox'
      );

    box.textContent =
      mensaje;

    box.style.display =
      'block';
  }


  function ocultarError() {
    document
      .getElementById(
        'errorBox'
      )
      .style
      .display =
        'none';
  }


  function avisoMVP(
    mensaje
  ) {
    const toast =
      document.getElementById(
        'toast'
      );

    toast.textContent =
      mensaje;

    toast
      .classList
      .add(
        'visible'
      );

    window.clearTimeout(
      avisoMVP.timeout
    );

    avisoMVP.timeout =
      window.setTimeout(
        function() {
          toast
            .classList
            .remove(
              'visible'
            );
        },
        4000
      );
  }


  function formatoMoneda(
    valor
  ) {
    return new Intl
      .NumberFormat(
        'es-CL',
        {
          style:
            'currency',

          currency:
            'CLP',

          maximumFractionDigits:
            0
        }
      )
      .format(
        Number(
          valor || 0
        )
      );
  }


  function formatoNumero(
    valor
  ) {
    return new Intl
      .NumberFormat(
        'es-CL',
        {
          maximumFractionDigits:
            3
        }
      )
      .format(
        Number(
          valor || 0
        )
      );
  }


  function escapeHtml(
    valor
  ) {
    return String(
      valor === null ||
      valor === undefined
        ? ''
        : valor
    )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
  }


  function jsString(
    valor
  ) {
    return String(
      valor === null ||
      valor === undefined
        ? ''
        : valor
    )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      ''
    )
    .replace(
      /\n/g,
      '\\n'
    );
  }


  function normalizar(
    valor
  ) {
    return String(
      valor || ''
    )
    .normalize(
      'NFD'
    )
    .replace(
      /[\u0300-\u036f]/g,
      ''
    )
    .toUpperCase()
    .trim();
  }
</script>

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#19476b"
  >

  <title>Gestión de Compras · Grupo Fiorentini</title>

  <style>

    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #e4e7ec;

      --brand: #19476b;
      --brand-soft: #e8f1f8;

      --primary: #1570ef;
      --success: #12b76a;
      --success-dark: #039855;

      --orange-bg: #fff1e8;
      --orange-text: #c4320a;

      --yellow-bg: #fffaeb;
      --yellow-text: #b54708;

      --blue-bg: #eff8ff;
      --blue-text: #175cd3;

      --purple-bg: #f4f3ff;
      --purple-text: #5925dc;

      --red-bg: #fef3f2;
      --red-text: #b42318;

      --gray-bg: #f2f4f7;
      --gray-text: #475467;

      --shadow:
        0 3px 12px rgba(16, 24, 40, 0.08);

      --radius: 16px;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);

      font-family:
        Arial,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }


    button,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .app-shell {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px;
    }


    /* =========================================================
       ENCABEZADO
       ========================================================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 16px 18px;

      background: #ffffff;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      position: sticky;
      top: 10px;
      z-index: 20;
    }


    .brand-title {
      margin: 0;

      font-size: 23px;
      font-weight: 900;

      letter-spacing: -0.4px;
    }


    .brand-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
    }


    .btn-refresh {
      min-height: 44px;

      border: none;

      border-radius: 11px;

      padding: 10px 16px;

      background:
        var(--success);

      color: #ffffff;

      font-weight: 850;

      display: inline-flex;
      align-items: center;

      gap: 8px;
    }


    .btn-refresh:hover {
      background:
        var(--success-dark);
    }


    .btn-refresh:disabled {
      opacity: 0.55;
      cursor: wait;
    }


    /* =========================================================
       FILTROS
       ========================================================= */

    .filters-card {
      margin-top: 16px;

      background: #ffffff;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      padding: 14px;
    }


    .filters-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(180px, 1fr)
        );

      gap: 12px;
    }


    .filter-group label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;
      font-weight: 850;

      text-transform: uppercase;

      color: #475467;

      letter-spacing: 0.4px;
    }


    .filter-select {
      width: 100%;
      height: 44px;

      padding: 0 12px;

      border:
        1px solid #d0d5dd;

      border-radius: 10px;

      background: #ffffff;

      color: var(--text);
    }


    .filters-footer {
      margin-top: 12px;
      padding-top: 12px;

      border-top:
        1px solid var(--border);

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;
    }


    .result-count,
    .last-update {
      font-size: 12px;
      color: var(--muted);
    }


    /* =========================================================
       MENSAJES
       ========================================================= */

    .loading-box,
    .empty-box,
    .error-box {
      margin-top: 18px;

      padding: 30px;

      border-radius:
        var(--radius);

      background: #ffffff;

      border:
        1px solid var(--border);

      box-shadow:
        var(--shadow);

      text-align: center;
    }


    .error-box {
      color: var(--red-text);

      border-color: #fecdca;

      background: #fff6f5;
    }


    .spinner {
      width: 32px;
      height: 32px;

      margin:
        0 auto 12px;

      border:
        4px solid #e4e7ec;

      border-top-color:
        var(--primary);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }


    /* =========================================================
       TARJETAS
       ========================================================= */

    .cards-grid {
      margin-top: 18px;

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 16px;
    }


    .oc-card {
      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      padding: 15px;

      display: flex;
      flex-direction: column;

      min-height: 260px;
    }


    .card-topline {
      display: flex;

      align-items:
        flex-start;

      gap: 10px;
    }


    .select-box input {
      width: 20px;
      height: 20px;

      cursor: pointer;
    }


    .oc-heading {
      flex: 1;
      min-width: 0;
    }


    .oc-number-row {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }


    .oc-number {
      font-size: 17px;
      font-weight: 900;
    }


    .status-chip {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;
      line-height: 1.1;

      font-weight: 900;

      text-transform:
        uppercase;

      text-align: center;
    }


    .status-NARANJO {
      background: var(--orange-bg);
      color: var(--orange-text);
    }


    .status-AMARILLO {
      background: var(--yellow-bg);
      color: var(--yellow-text);
    }


    .status-AZUL {
      background: var(--blue-bg);
      color: var(--blue-text);
    }


    .status-MORADO {
      background: var(--purple-bg);
      color: var(--purple-text);
    }


    .status-ROJO {
      background: var(--red-bg);
      color: var(--red-text);
    }


    .status-GRIS {
      background: var(--gray-bg);
      color: var(--gray-text);
    }


    .provider-name {
      margin-top: 9px;

      font-size: 15px;
      font-weight: 900;

      word-break: break-word;
    }


    .card-meta {
      margin-top: 10px;

      display: grid;

      gap: 5px;

      font-size: 13px;

      color: #475467;
    }


    .card-meta strong {
      color: #344054;
    }


    .amount-row {
      margin-top: 12px;

      display: flex;

      justify-content:
        space-between;

      align-items: end;

      gap: 10px;
    }


    .line-count {
      font-size: 13px;

      color:
        var(--muted);
    }


    .total-amount {
      font-size: 20px;
      font-weight: 900;

      text-align: right;
    }


    .card-actions {
      margin-top: auto;

      padding-top: 16px;

      display: grid;

      grid-template-columns:
        1fr 1.2fr;

      gap: 9px;
    }


    .btn {
      min-height: 44px;

      border: none;

      border-radius: 10px;

      padding: 10px 12px;

      font-weight: 850;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    .btn-view {
      background: #eff8ff;
      color: #175cd3;
    }


    .btn-blue {
      background: var(--primary);
      color: #ffffff;
    }


    .btn-whatsapp {
      background: var(--success);
      color: #ffffff;
    }


    /* =========================================================
       MODAL
       ========================================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;

      overflow-y: auto;

      padding: 18px;

      background:
        rgba(
          16,
          24,
          40,
          0.72
        );

      z-index: 100;
    }


    .modal-overlay.visible {
      display: block;
    }


    .modal-container {
      width:
        min(
          1000px,
          100%
        );

      margin:
        18px auto;

      background: #ffffff;

      border-radius: 18px;

      overflow: hidden;
    }


    .modal-header {
      padding: 14px 18px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid var(--border);
    }


    .modal-header h2 {
      margin: 0;

      font-size: 19px;
    }


    .btn-close {
      width: 40px;
      height: 40px;

      border: none;

      border-radius: 50%;

      background: #f2f4f7;

      font-size: 24px;
    }


    .modal-body {
      padding: 18px;

      background: #f1f4f6;
    }


    .modal-footer {
      padding: 14px 18px;

      border-top:
        1px solid var(--border);

      display: flex;

      justify-content: flex-end;

      gap: 10px;

      background: #ffffff;
    }


    /* =========================================================
       OC DEFINITIVA
       ========================================================= */

    .purchase-order {
      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      padding: 26px 30px;

      background: #ffffff;

      color: #111827;

      border:
        1px solid #d0d5dd;

      box-shadow:
        0 4px 18px
        rgba(16, 24, 40, 0.08);
    }


    .po-title {
      min-height: 58px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        var(--brand-soft);

      color: var(--brand);

      font-size: 22px;

      font-weight: 900;

      letter-spacing: 0.4px;

      border-bottom:
        4px solid var(--brand);
    }


    .po-top {
      display: grid;

      grid-template-columns:
        1.15fr 0.85fr;

      gap: 28px;

      padding:
        20px 0 16px;
    }


    .po-company-name {
      font-size: 17px;

      font-weight: 900;

      color:
        var(--brand);

      margin-bottom: 8px;
    }


    .po-info-line {
      margin-top: 4px;

      font-size: 12px;

      line-height: 1.4;
    }


    .po-right {
      display: grid;

      gap: 7px;
    }


    .po-field {
      display: grid;

      grid-template-columns:
        145px 1fr;

      align-items: center;

      min-height: 30px;

      font-size: 12px;
    }


    .po-field-label {
      font-weight: 900;

      color:
        var(--brand);
    }


    .po-field-value {
      font-weight: 700;
    }


    .po-status {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 30px;

      padding: 5px 10px;

      background: #dcfae6;

      border:
        1px solid #abefc6;

      color: #067647;

      border-radius: 6px;

      font-weight: 900;

      text-align: center;
    }


    .supplier-section {
      margin-top: 5px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 24px;
    }


    .supplier-title {
      margin-bottom: 9px;

      font-size: 13px;

      font-weight: 900;

      color:
        var(--brand);
    }


    .supplier-reminder {
      padding: 12px 14px;

      border:
        1px solid #d7e2ec;

      background:
        #f8fbfd;

      font-size: 12px;

      line-height: 1.45;
    }


    .supplier-reminder-oc {
      margin-top: 10px;

      font-size: 17px;

      font-weight: 900;

      color:
        var(--brand);

      text-align: center;
    }


    .po-table-wrap {
      margin-top: 22px;

      overflow-x: auto;
    }


    .po-table {
      width: 100%;

      border-collapse:
        collapse;

      font-size: 11px;
    }


    .po-table th {
      padding: 9px 6px;

      background:
        var(--brand);

      color: #ffffff;

      text-align: center;

      font-weight: 900;

      border-right:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );
    }


    .po-table td {
      padding: 9px 6px;

      border-bottom:
        1px solid #d6e2ed;

      border-right:
        1px solid #e0eaf2;

      vertical-align: middle;
    }


    .po-table td.number {
      text-align: center;
    }


    .po-table td.money {
      text-align: right;

      white-space: nowrap;
    }


    .totals-block {
      margin-top: 14px;

      margin-left: auto;

      width:
        min(
          330px,
          100%
        );

      border-collapse:
        collapse;
    }


    .totals-block td {
      padding: 8px 10px;

      border-bottom:
        1px solid #d6e2ed;

      font-size: 12px;
    }


    .totals-block td:first-child {
      font-weight: 800;
    }


    .totals-block td:last-child {
      text-align: right;

      font-weight: 900;
    }


    .totals-block .grand-total {
      background:
        var(--brand-soft);

      color:
        var(--brand);

      font-size: 15px;

      font-weight: 900;
    }


    .po-footer {
      margin-top: 26px;

      padding-top: 15px;

      border-top:
        2px solid var(--brand);

      font-size: 10px;

      line-height: 1.45;

      color: #475467;
    }


    .po-thanks {
      margin-top: 18px;

      text-align: center;

      color:
        #667085;

      font-size: 10px;
    }


    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 24px;

      transform:
        translateX(-50%)
        translateY(100px);

      opacity: 0;

      padding: 13px 16px;

      max-width:
        calc(
          100vw - 30px
        );

      border-radius: 12px;

      background: #101828;

      color: #ffffff;

      font-size: 13px;

      font-weight: 700;

      z-index: 200;

      transition:
        all 0.22s ease;
    }


    .toast.visible {
      transform:
        translateX(-50%)
        translateY(0);

      opacity: 1;
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media
      (max-width: 1050px) {

      .cards-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }


    /* =========================================================
       CELULAR
       ========================================================= */

    @media
      (max-width: 720px) {

      .app-shell {
        padding: 10px;
      }


      .topbar {
        top: 6px;

        padding: 13px;
      }


      .brand-title {
        font-size: 18px;
      }


      .brand-subtitle {
        display: none;
      }


      .filters-grid {
        grid-template-columns:
          1fr;
      }


      .filters-footer {
        flex-direction:
          column;

        align-items:
          flex-start;
      }


      .cards-grid {
        grid-template-columns:
          1fr;
      }


      .modal-overlay {
        padding: 0;

        background: #ffffff;
      }


      .modal-container {
        margin: 0;

        min-height: 100vh;

        border-radius: 0;
      }


      .modal-body {
        padding: 6px;
      }


      .purchase-order {
        padding: 16px 12px;

        border: none;

        box-shadow: none;
      }


      .po-title {
        min-height: 48px;

        font-size: 18px;
      }


      .po-top {
        grid-template-columns:
          1fr;

        gap: 15px;
      }


      .supplier-section {
        grid-template-columns:
          1fr;
      }


      .po-field {
        grid-template-columns:
          135px 1fr;
      }


      .modal-footer {
        position: sticky;
        bottom: 0;

        display: grid;

        grid-template-columns:
          1fr 1fr;

        padding:
          10px
          10px
          calc(
            10px +
            env(
              safe-area-inset-bottom
            )
          );
      }

    }


    @media
      (max-width: 390px) {

      .btn-refresh-text {
        display: none;
      }


      .card-actions {
        grid-template-columns:
          1fr;
      }


      .modal-footer {
        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>


<body>


  <div class="app-shell">


    <header class="topbar">

      <div>

        <h1 class="brand-title">
          Gestión de Compras
        </h1>

        <div class="brand-subtitle">
          Grupo Fiorentini · Panel operativo
        </div>

      </div>


      <button
        id="btnActualizar"
        class="btn-refresh"
        onclick="cargarDatos()"
      >

        <span>↻</span>

        <span class="btn-refresh-text">
          Actualizar
        </span>

      </button>

    </header>


    <section class="filters-card">

      <div class="filters-grid">


        <div class="filter-group">

          <label>
            Estado
          </label>

          <select
            id="filtroEstado"
            class="filter-select"
            onchange="aplicarFiltros()"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label>
            Proveedor
          </label>

          <select
            id="filtroProveedor"
            class="filter-select"
            onchange="aplicarFiltros()"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label>
            Empresa
          </label>

          <select
            id="filtroEmpresa"
            class="filter-select"
            onchange="aplicarFiltros()"
          >

            <option value="">
              Todas
            </option>

          </select>

        </div>


      </div>


      <div class="filters-footer">

        <div
          id="contadorResultados"
          class="result-count"
        >
          0 OC
        </div>


        <div
          id="ultimaActualizacion"
          class="last-update"
        >
          Sin actualizar
        </div>

      </div>

    </section>


    <div
      id="loading"
      class="loading-box"
    >

      <div class="spinner"></div>

      Cargando órdenes de compra...

    </div>


    <div
      id="errorBox"
      class="error-box"
      style="display:none;"
    ></div>


    <div
      id="emptyBox"
      class="empty-box"
      style="display:none;"
    >

      No existen órdenes de compra para los filtros seleccionados.

    </div>


    <main
      id="cardsContainer"
      class="cards-grid"
    ></main>


  </div>


  <div
    id="modalOC"
    class="modal-overlay"
    onclick="cerrarModalPorFondo(event)"
  >

    <div class="modal-container">


      <div class="modal-header">

        <h2>
          Vista previa OC
        </h2>


        <button
          class="btn-close"
          onclick="cerrarOC()"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <div
          id="documentoOC"
        ></div>

      </div>


      <div class="modal-footer">

        <button
          class="btn btn-view"
          onclick="cerrarOC()"
        >
          Volver
        </button>


        <button
          id="btnEnviarModal"
          class="btn btn-whatsapp"
          onclick="simularEnvioDesdeModal()"
        >
          Enviar por WhatsApp
        </button>

      </div>


    </div>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <script>


    /**********************************************************
     * CONFIG
     **********************************************************/

    const CONFIG = {

      API_BASE_URL:
        'https://script.google.com/macros/s/AKfycbyB-26Y-FVjiiD7-yVsQ8rKDZu81ZyVxdzcjd4oaj5fQgKi8MswBwdNR-zN7owVxwU84g/exec'

    };


    let PANEL = {
      actualizado: '',
      oc: [],
      proveedores: [],
      empresas: [],
      estados: []
    };


    let OC_VISIBLE = [];

    let OC_MODAL_ACTUAL =
      null;



    /**********************************************************
     * INICIO
     **********************************************************/

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        cargarDatos();

      }
    );



    /**********************************************************
     * API
     **********************************************************/

    async function cargarDatos() {

      mostrarCarga(true);

      ocultarError();


      const boton =
        document.getElementById(
          'btnActualizar'
        );


      boton.disabled =
        true;


      try {

        const url =
          CONFIG.API_BASE_URL
          +
          '?api=compras'
          +
          '&accion=listar';


        const respuesta =
          await cargarJsonp(
            url
          );


        if (
          !respuesta ||
          respuesta.ok !== true
        ) {

          throw new Error(
            respuesta &&
            respuesta.error

              ? respuesta.error

              : 'No fue posible cargar Compras.'
          );

        }


        PANEL =
          respuesta.data;


        cargarSelects();

        aplicarFiltros();


        document
          .getElementById(
            'ultimaActualizacion'
          )
          .textContent =
            'Actualizado: '
            +
            (
              PANEL.actualizado ||
              '-'
            );


      } catch (
        error
      ) {

        mostrarError(
          error.message ||
          String(
            error
          )
        );

      } finally {

        mostrarCarga(
          false
        );

        boton.disabled =
          false;

      }

    }



    function cargarJsonp(
      url
    ) {

      return new Promise(
        function(
          resolve,
          reject
        ) {

          const callback =
            '__gfCompras_'
            +
            Date.now()
            +
            '_'
            +
            Math.floor(
              Math.random()
              *
              100000
            );


          const script =
            document.createElement(
              'script'
            );


          const separador =
            url.includes('?')
              ? '&'
              : '?';


          const timeout =
            window.setTimeout(
              function() {

                limpiar();

                reject(
                  new Error(
                    'Tiempo de espera agotado consultando MAESTRO.'
                  )
                );

              },
              20000
            );


          function limpiar() {

            window.clearTimeout(
              timeout
            );


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }


            try {

              delete window[
                callback
              ];

            } catch (
              error
            ) {

              window[
                callback
              ] =
                undefined;

            }

          }


          window[
            callback
          ] =
            function(
              respuesta
            ) {

              limpiar();

              resolve(
                respuesta
              );

            };


          script.onerror =
            function() {

              limpiar();

              reject(
                new Error(
                  'No fue posible conectar con la API.'
                )
              );

            };


          script.src =
            url
            +
            separador
            +
            'callback='
            +
            encodeURIComponent(
              callback
            );


          document.head
            .appendChild(
              script
            );

        }
      );

    }



    /**********************************************************
     * FILTROS
     **********************************************************/

    function cargarSelects() {

      llenarSelect(
        'filtroEstado',
        PANEL.estados || [],
        'Todos'
      );


      llenarSelect(
        'filtroProveedor',
        PANEL.proveedores || [],
        'Todos'
      );


      llenarSelect(
        'filtroEmpresa',
        PANEL.empresas || [],
        'Todas'
      );

    }


    function llenarSelect(
      id,
      valores,
      todos
    ) {

      const select =
        document.getElementById(
          id
        );


      const actual =
        select.value;


      select.innerHTML =
        '';


      const option =
        document.createElement(
          'option'
        );


      option.value =
        '';

      option.textContent =
        todos;


      select.appendChild(
        option
      );


      valores.forEach(
        function(
          valor
        ) {

          const op =
            document.createElement(
              'option'
            );


          op.value =
            valor;

          op.textContent =
            valor;


          select.appendChild(
            op
          );

        }
      );


      if (
        Array
          .from(
            select.options
          )
          .some(
            function(
              op
            ) {

              return (
                op.value ===
                actual
              );

            }
          )
      ) {

        select.value =
          actual;

      }

    }



    function aplicarFiltros() {

      const estado =
        document
          .getElementById(
            'filtroEstado'
          )
          .value;


      const proveedor =
        document
          .getElementById(
            'filtroProveedor'
          )
          .value;


      const empresa =
        document
          .getElementById(
            'filtroEmpresa'
          )
          .value;


      OC_VISIBLE =
        (
          PANEL.oc ||
          []
        )
        .filter(
          function(
            item
          ) {

            return (
              (
                !estado ||
                item.estado ===
                  estado
              )
              &&
              (
                !proveedor ||
                item.proveedor ===
                  proveedor
              )
              &&
              (
                !empresa ||
                item.empresa ===
                  empresa
              )
            );

          }
        );


      renderTarjetas(
        OC_VISIBLE
      );

    }



    /**********************************************************
     * TARJETAS
     **********************************************************/

    function renderTarjetas(
      lista
    ) {

      const contenedor =
        document.getElementById(
          'cardsContainer'
        );


      const empty =
        document.getElementById(
          'emptyBox'
        );


      contenedor.innerHTML =
        '';


      document
        .getElementById(
          'contadorResultados'
        )
        .textContent =
          lista.length
          +
          ' OC';


      if (
        !lista.length
      ) {

        empty.style.display =
          'block';

        return;

      }


      empty.style.display =
        'none';


      lista.forEach(
        function(
          item
        ) {

          const card =
            document.createElement(
              'article'
            );


          card.className =
            'oc-card';


          card.innerHTML = `

            <div class="card-topline">

              <div class="select-box">

                <input
                  type="checkbox"
                  data-clave="${escapeHtml(item.clave)}"
                >

              </div>


              <div class="oc-heading">


                <div class="oc-number-row">

                  <div class="oc-number">

                    ${escapeHtml(item.oc)}

                  </div>


                  <span
                    class="
                      status-chip
                      status-${escapeHtml(item.color || 'GRIS')}
                    "
                  >

                    ${escapeHtml(item.estado)}

                  </span>

                </div>


                <div class="provider-name">

                  ${escapeHtml(item.proveedor || 'SIN PROVEEDOR')}

                </div>


                <div class="card-meta">

                  <div>

                    <strong>
                      Empresa:
                    </strong>

                    ${escapeHtml(item.empresa)}

                  </div>


                  <div>

                    <strong>
                      Lote:
                    </strong>

                    ${escapeHtml(item.lote || '-')}

                  </div>

                </div>


                <div class="amount-row">

                  <div class="line-count">

                    ${item.cantidadLineas || 0}

                    ${
                      Number(
                        item.cantidadLineas
                      ) === 1
                        ? 'producto'
                        : 'productos'
                    }

                  </div>


                  <div class="total-amount">

                    ${formatoMoneda(item.bruto)}

                  </div>

                </div>

              </div>

            </div>


            <div class="card-actions">


              <button
                class="btn btn-view"
                onclick="
                  verOC(
                    '${jsString(item.clave)}'
                  )
                "
              >

                Ver OC

              </button>


              ${
                botonAccionHTML(
                  item
                )
              }


            </div>

          `;


          contenedor.appendChild(
            card
          );

        }
      );

    }



    function botonAccionHTML(
      item
    ) {

      const estado =
        normalizar(
          item.estado
        );


      if (
        estado ===
        'PENDIENTE DE ENVIO'
      ) {

        return `

          <button
            class="btn btn-whatsapp"
            onclick="
              simularEnvio(
                '${jsString(item.clave)}'
              )
            "
          >
            WhatsApp
          </button>

        `;

      }


      if (
        estado ===
        'ESPERANDO RESPUESTA'
      ) {

        return `

          <button
            class="btn btn-blue"
            onclick="
              avisoMVP(
                'Registro de respuesta todavía no habilitado.'
              )
            "
          >
            Registrar respuesta
          </button>

        `;

      }


      if (
        estado ===
        'HABILITADA PARA RECEPCION'
        ||
        estado ===
        'RECEPCIONADA'
      ) {

        return `

          <button
            class="btn btn-blue"
            onclick="
              avisoMVP(
                'Esta OC continúa visible hasta que Pagos confirme RECIBIDO.'
              )
            "
          >
            Seguimiento
          </button>

        `;

      }


      if (
        estado ===
        'EXCEPCION'
      ) {

        return `

          <button
            class="btn btn-blue"
            onclick="
              avisoMVP(
                'Gestión de excepción todavía no habilitada.'
              )
            "
          >
            Gestionar detalle
          </button>

        `;

      }


      return '';

    }



    /**********************************************************
     * VER OC
     **********************************************************/

    function verOC(
      clave
    ) {

      const item =
        (
          PANEL.oc ||
          []
        )
        .find(
          function(
            oc
          ) {

            return (
              oc.clave ===
              clave
            );

          }
        );


      if (
        !item
      ) {

        avisoMVP(
          'No se pudo localizar la OC.'
        );

        return;

      }


      OC_MODAL_ACTUAL =
        item;


      document
        .getElementById(
          'documentoOC'
        )
        .innerHTML =
          construirDocumentoOC(
            item
          );


      document
        .getElementById(
          'btnEnviarModal'
        )
        .style
        .display =

          normalizar(
            item.estado
          ) ===
          'PENDIENTE DE ENVIO'

            ? 'flex'

            : 'none';


      document
        .getElementById(
          'modalOC'
        )
        .classList
        .add(
          'visible'
        );


      document.body.style.overflow =
        'hidden';

    }



    function construirDocumentoOC(
      item
    ) {

      const filas =
        (
          item.lineas ||
          []
        )
        .map(
          function(
            linea,
            index
          ) {

            return `

              <tr>

                <td class="number">
                  ${index + 1}
                </td>

                <td class="number">
                  ${escapeHtml(linea.codigo || '')}
                </td>

                <td>
                  ${escapeHtml(linea.producto)}
                </td>

                <td class="number">
                  ${formatoNumero(linea.cantidad)}
                </td>

                <td class="number">
                  ${escapeHtml(linea.unidad)}
                </td>

                <td class="money">
                  ${formatoMoneda(linea.precio)}
                </td>

                <td class="money">
                  ${formatoMoneda(linea.total)}
                </td>

              </tr>

            `;

          }
        )
        .join('');


      const datosProveedor =
        [
          campoDocumento(
            'RUT',
            item.rutProveedor
          ),

          campoDocumento(
            'Contacto',
            item.contactoProveedor
          ),

          campoDocumento(
            'Correo',
            item.correoProveedor
          ),

          campoDocumento(
            'Teléfono',
            item.telefonoProveedor
          )
        ]
        .filter(Boolean)
        .join('');


      const jefatura =
        construirJefatura(
          item
        );


      return `

        <div class="purchase-order">


          <div class="po-title">
            ORDEN DE COMPRA
          </div>


          <div class="po-top">


            <div>

              <div class="po-company-name">

                ${escapeHtml(
                  item.empresaDocumento ||
                  item.empresa
                )}

              </div>


              ${campoDocumento(
                'RUT',
                item.rutEmpresa
              )}


              ${campoDocumento(
                'Dirección',
                item.direccionEmpresa
              )}


              ${campoDocumento(
                'Correo',
                item.correoEmpresa
              )}


              ${jefatura}

            </div>


            <div class="po-right">


              <div class="po-field">

                <div class="po-field-label">
                  N° OC:
                </div>

                <div class="po-field-value">
                  ${escapeHtml(item.oc)}
                </div>

              </div>


              ${
                item.lote

                  ? `

                    <div class="po-field">

                      <div class="po-field-label">
                        LOTE:
                      </div>

                      <div class="po-field-value">
                        ${escapeHtml(item.lote)}
                      </div>

                    </div>

                  `

                  : ''
              }


              <div class="po-field">

                <div class="po-field-label">
                  FECHA DE EMISIÓN:
                </div>

                <div class="po-field-value">
                  ${escapeHtml(item.fechaEmision || '-')}
                </div>

              </div>


              ${
                item.fechaEntrega

                  ? `

                    <div class="po-field">

                      <div class="po-field-label">
                        FECHA DE ENTREGA:
                      </div>

                      <div class="po-field-value">
                        ${escapeHtml(item.fechaEntrega)}
                      </div>

                    </div>

                  `

                  : ''
              }


              <div class="po-field">

                <div class="po-field-label">
                  ESTADO:
                </div>

                <div class="po-status">
                  APROBADO POR JEFATURA
                </div>

              </div>


            </div>


          </div>


          <div class="supplier-section">


            <div>

              <div class="supplier-title">
                DATOS DEL PROVEEDOR
              </div>


              <div class="po-company-name">

                ${escapeHtml(item.proveedor || '-')}

              </div>


              ${datosProveedor}


            </div>


            <div class="supplier-reminder">

              Por favor, en todas sus facturas,
              guías de despacho y documentos tributarios,
              indique el número de esta Orden de Compra:

              <div class="supplier-reminder-oc">

                ${escapeHtml(item.oc)}

              </div>

            </div>


          </div>


          <div class="po-table-wrap">


            <table class="po-table">

              <thead>

                <tr>

                  <th>N°</th>

                  <th>CÓDIGO</th>

                  <th>PRODUCTO</th>

                  <th>CANTIDAD</th>

                  <th>UND. DE MEDIDA</th>

                  <th>PRECIO UNITARIO</th>

                  <th>TOTAL</th>

                </tr>

              </thead>


              <tbody>

                ${filas}

              </tbody>

            </table>


          </div>


          <table class="totals-block">


            <tr>

              <td>
                NETO
              </td>

              <td>
                ${formatoMoneda(item.neto)}
              </td>

            </tr>


            <tr>

              <td>
                IVA 19%
              </td>

              <td>
                ${formatoMoneda(item.iva)}
              </td>

            </tr>


            <tr class="grand-total">

              <td>
                TOTAL
              </td>

              <td>
                ${formatoMoneda(item.bruto)}
              </td>

            </tr>


          </table>


          <div class="po-footer">

            <strong>
              CONDICIONES GENERALES
            </strong>

            <br><br>

            Esta Orden de Compra corresponde a las
            cantidades y condiciones autorizadas vigentes.

            <br><br>

            Los estados internos de Gestión de Compras,
            incidencias, reautorizaciones, Recepción y Pagos
            no forman parte del documento remitido al proveedor.

          </div>


          <div class="po-thanks">

            Gracias por ser parte de Grupo Fiorentini.

          </div>


        </div>

      `;

    }



    function construirJefatura(
      item
    ) {

      if (
        !item.autorizadoPorJefatura
        &&
        !item.fechaAutorizacionJefatura
      ) {

        return '';

      }


      let texto =
        'Jefatura:';


      if (
        item.autorizadoPorJefatura
      ) {

        texto +=
          ' '
          +
          item.autorizadoPorJefatura;

      }


      if (
        item.fechaAutorizacionJefatura
      ) {

        texto +=
          ' · '
          +
          item.fechaAutorizacionJefatura;

      }


      return `

        <div class="po-info-line">

          ${escapeHtml(texto)}

        </div>

      `;

    }



    function campoDocumento(
      etiqueta,
      valor
    ) {

      if (
        !valor
      ) {

        return '';

      }


      return `

        <div class="po-info-line">

          <strong>
            ${escapeHtml(etiqueta)}:
          </strong>

          ${escapeHtml(valor)}

        </div>

      `;

    }



    /**********************************************************
     * CERRAR
     **********************************************************/

    function cerrarOC() {

      document
        .getElementById(
          'modalOC'
        )
        .classList
        .remove(
          'visible'
        );


      document.body.style.overflow =
        '';


      OC_MODAL_ACTUAL =
        null;

    }


    function cerrarModalPorFondo(
      event
    ) {

      if (
        event.target.id ===
        'modalOC'
      ) {

        cerrarOC();

      }

    }



    /**********************************************************
     * WHATSAPP TODAVÍA SIMULADO
     **********************************************************/

    function simularEnvio(
      clave
    ) {

      const item =
        (
          PANEL.oc ||
          []
        )
        .find(
          function(
            oc
          ) {

            return (
              oc.clave ===
              clave
            );

          }
        );


      if (
        !item
      ) {

        return;

      }


      avisoMVP(

        item.oc
        +
        ' está lista para WhatsApp Empresa. '
        +
        'Todavía NO se registra envío en MAESTRO.'

      );

    }


    function simularEnvioDesdeModal() {

      if (
        OC_MODAL_ACTUAL
      ) {

        simularEnvio(
          OC_MODAL_ACTUAL.clave
        );

      }

    }



    /**********************************************************
     * UI
     **********************************************************/

    function mostrarCarga(
      mostrar
    ) {

      document
        .getElementById(
          'loading'
        )
        .style
        .display =

          mostrar
            ? 'block'
            : 'none';

    }


    function mostrarError(
      mensaje
    ) {

      const box =
        document.getElementById(
          'errorBox'
        );


      box.textContent =
        mensaje;


      box.style.display =
        'block';

    }


    function ocultarError() {

      document
        .getElementById(
          'errorBox'
        )
        .style
        .display =
          'none';

    }


    function avisoMVP(
      mensaje
    ) {

      const toast =
        document.getElementById(
          'toast'
        );


      toast.textContent =
        mensaje;


      toast.classList.add(
        'visible'
      );


      window.clearTimeout(
        avisoMVP.timeout
      );


      avisoMVP.timeout =
        window.setTimeout(
          function() {

            toast.classList.remove(
              'visible'
            );

          },
          4200
        );

    }



    /**********************************************************
     * FORMATOS
     **********************************************************/

    function formatoMoneda(
      valor
    ) {

      return new Intl
        .NumberFormat(
          'es-CL',
          {
            style: 'currency',
            currency: 'CLP',
            maximumFractionDigits: 0
          }
        )
        .format(
          Number(
            valor ||
            0
          )
        );

    }


    function formatoNumero(
      valor
    ) {

      return new Intl
        .NumberFormat(
          'es-CL',
          {
            maximumFractionDigits:
              3
          }
        )
        .format(
          Number(
            valor ||
            0
          )
        );

    }



    /**********************************************************
     * SEGURIDAD
     **********************************************************/

    function escapeHtml(
      valor
    ) {

      return String(
        valor === null ||
        valor === undefined

          ? ''

          : valor
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

    }


    function jsString(
      valor
    ) {

      return String(
        valor === null ||
        valor === undefined

          ? ''

          : valor
      )
      .replace(
        /\\/g,
        '\\\\'
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\r/g,
        ''
      )
      .replace(
        /\n/g,
        '\\n'
      );

    }


    function normalizar(
      valor
    ) {

      return String(
        valor ||
        ''
      )
      .normalize(
        'NFD'
      )
      .replace(
        /[\u0300-\u036f]/g,
        ''
      )
      .toUpperCase()
      .trim();

    }


  </script>
